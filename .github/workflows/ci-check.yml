name: CI - Nix Checks

on:
  push:
  workflow_call:
    secrets:
      ATTIC_CACHE_KEY:
        required: true

jobs:
  nix-flake-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: "Run .#checks in parallel"
        run: nix run github:Mic92/nix-fast-build -- --no-nom --skip-cached
